<!doctype html>
<!--
  Source artwork for the social preview card (public/og.png).

  Rendered to PNG by scripts/make-og.mjs using headless Chrome. That happens
  ONCE, locally, and the resulting PNG is committed -- the deploy builder has no
  browser, so generating this at build time would break the build. Re-run the
  script by hand if the wording or palette changes.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        background: #0f1117;
        background-image:
          radial-gradient(circle at 88% 12%, rgba(99, 102, 241, 0.28), transparent 46%),
          radial-gradient(circle at 8% 92%, rgba(16, 185, 129, 0.20), transparent 42%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        color: #f5f7fa;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 36px;
      }

      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #6366f1, #10b981);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mark svg { width: 24px; height: 24px; }

      .brand-name {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #c9d1de;
      }

      h1 {
        font-size: 82px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.035em;
        max-width: 15ch;
      }

      .accent {
        background: linear-gradient(120deg, #818cf8, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        margin-top: 30px;
        font-size: 31px;
        line-height: 1.4;
        color: #9aa5b6;
        max-width: 26ch;
      }

      .badges {
        margin-top: 46px;
        display: flex;
        gap: 13px;
      }

      .badge {
        font-size: 21px;
        font-weight: 500;
        color: #c9d1de;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.05);
        border-radius: 999px;
        padding: 11px 23px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="8.5" cy="8.5" r="1.6" />
          <path d="M21 15l-5-5L5 21" />
        </svg>
      </div>
      <div class="brand-name">imagethings.shop</div>
    </div>

    <h1>Image tools that <span class="accent">just work</span>.</h1>

    <p>Compress, resize, convert and edit — in seconds.</p>

    <div class="badges">
      <div class="badge">Runs in your browser</div>
      <div class="badge">No signup</div>
      <div class="badge">Free</div>
    </div>
  </body>
</html>
